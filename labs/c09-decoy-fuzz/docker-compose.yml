name: vhc09

services:
  edge:
    image: vhostlab/edge:1.0
    container_name: vhc09-edge
    restart: unless-stopped
    ports:
      - "0.0.0.0:18160:8080"
      - "0.0.0.0:18523:8443"
    volumes:
      - ./edge/sites.json:/etc/vhostlab/sites.json:ro
      - ./edge/certs:/certs:ro
      - ./sites:/sites:ro
    networks:
      lab:

  site-iis:
    image: nginx:alpine
    container_name: vhc09-iis
    restart: unless-stopped
    volumes:
      - ./sites/vhosts:/vhosts:ro
      - ./sites/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      lab:
        ipv4_address: 172.28.90.20

networks:
  lab:
    name: vhc09-lab
    ipam:
      config:
        - subnet: 172.28.90.0/24
