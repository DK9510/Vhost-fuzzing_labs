name: vhc04

services:
  edge:
    image: vhostlab/edge:1.0
    container_name: vhc04-edge
    restart: unless-stopped
    ports:
      - "0.0.0.0:18110:8080"
      - "0.0.0.0:18473:8443"
    volumes:
      - ./edge/sites.json:/etc/vhostlab/sites.json:ro
      - ./edge/certs:/certs:ro
      - ./sites:/sites:ro
    networks:
      lab:

  site-app:
    image: nginx:alpine
    container_name: vhc04-app
    restart: unless-stopped
    volumes:
      - ./sites/app:/app:ro
      - ./sites/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      lab:
        ipv4_address: 172.28.40.20

networks:
  lab:
    name: vhc04-lab
    ipam:
      config:
        - subnet: 172.28.40.0/24
