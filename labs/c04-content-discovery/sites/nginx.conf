server {
    listen 80 default_server;
    server_name _;

    root /app;
    index index.html;
    server_tokens off;
    autoindex off;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # a backup copy of the app tree exists but is not readable
    location ~* \.backup(/|$) {
        return 403;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
