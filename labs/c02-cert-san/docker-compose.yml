name: vhc02

services:
  edge:
    image: vhostlab/edge:1.0
    container_name: vhc02-edge
    restart: unless-stopped
    ports:
      - "0.0.0.0:18090:8080"
      - "0.0.0.0:18453:8443"
    volumes:
      - ./edge/sites.json:/etc/vhostlab/sites.json:ro
      - ./edge/certs:/certs:ro
      - ./sites:/sites:ro
    networks:
      lab:

  site-corp:
    image: nginx:alpine
    container_name: vhc02-corp
    restart: unless-stopped
    volumes:
      - ./sites/corp:/usr/share/nginx/html:ro
      - ./sites/corp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      lab:
        ipv4_address: 172.28.20.20

networks:
  lab:
    name: vhc02-lab
    ipam:
      config:
        - subnet: 172.28.20.0/24
