server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        default_type application/json;
        add_header Server "OpsGate/1.0" always;
        return 200 '{"service":"ops-console","status":"ok","zone":"corp.lab"}';
    }

    location / {
        add_header Server "OpsGate/1.0" always;
        try_files $uri /index.html;
    }
}
