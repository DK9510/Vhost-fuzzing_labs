name: vhc11

services:
  edge:
    image: vhostlab/edge:1.0
    container_name: vhc11-edge
    restart: unless-stopped
    ports:
      - "0.0.0.0:18190:8080"
      - "0.0.0.0:18553:8443"
    volumes:
      - ./edge/sites.json:/etc/vhostlab/sites.json:ro
      - ./edge/certs:/certs:ro
      - ./sites:/sites:ro
    networks:
      lab:

  app:
    image: nginx:alpine
    container_name: vhc11-app
    restart: unless-stopped
    volumes:
      - ./sites/app:/usr/share/nginx/html:ro
      - ./sites/app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      lab:
        ipv4_address: 172.28.120.20

networks:
  lab:
    name: vhc11-lab
    ipam:
      config:
        - subnet: 172.28.120.0/24
