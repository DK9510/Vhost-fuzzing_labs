name: vhc01

services:
  edge:
    image: vhostlab/edge:1.0
    container_name: vhc01-edge
    restart: unless-stopped
    ports:
      - "0.0.0.0:18080:8080"
      - "0.0.0.0:18443:8443"
    volumes:
      - ./edge/sites.json:/etc/vhostlab/sites.json:ro
      - ./edge/certs:/certs:ro
      - ./sites:/sites:ro
    networks:
      lab:

  site-iis:
    image: nginx:alpine
    container_name: vhc01-iis
    restart: unless-stopped
    volumes:
      - ./sites/iis:/usr/share/nginx/html:ro
      - ./sites/iis/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      lab:
        ipv4_address: 172.28.10.20

networks:
  lab:
    name: vhc01-lab
    ipam:
      config:
        - subnet: 172.28.10.0/24
