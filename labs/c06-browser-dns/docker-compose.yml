name: vhc06

services:
  edge:
    image: vhostlab/edge:1.0
    container_name: vhc06-edge
    restart: unless-stopped
    ports:
      - "0.0.0.0:18130:8080"
      - "0.0.0.0:18493:8443"
    volumes:
      - ./edge/sites.json:/etc/vhostlab/sites.json:ro
      - ./edge/certs:/certs:ro
      - ./sites:/sites:ro
    networks:
      lab:

  api:
    image: vhostlab/api:1.0
    container_name: vhc06-api
    restart: unless-stopped
    environment:
      DEBUG: "0"
      BROWSABLE: "1"
      FLAG: "${FLAG:-FLAG{browsable_api_is_not_a_finding}}"
      BASE_DOMAIN: "corp.lab"
      API_HOST: "chat-api.corp.lab"
      FRONT_URL: "https://chatadmin.corp.lab"
      ADMIN_EMAIL: "admin@corp.lab"
      ADMIN_PASSWORD: "Sup3rS3cret!2026"
      AGENT_PASSWORD: "agent-pass-2026"
      JWT_KEY: "vhc06-jwt-key-do-not-reuse"
      SECRET_KEY: "vhc06-django-secret"
      DB_PATH: "/data/db.sqlite3"
      EMAIL_HOST: "127.0.0.1"
      EMAIL_PORT: "2525"
      DEFAULT_FROM_EMAIL: "no-reply@corp.lab"
    volumes:
      - api-data:/data
    networks:
      lab:
        ipv4_address: 172.28.60.21

  site-spa:
    image: nginx:alpine
    container_name: vhc06-spa
    restart: unless-stopped
    volumes:
      - ./sites/spa:/spa:ro
      - ./sites/spa/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      lab:
        ipv4_address: 172.28.60.20

volumes:
  api-data:
    name: vhc06-api-data

networks:
  lab:
    name: vhc06-lab
    ipam:
      config:
        - subnet: 172.28.60.0/24
