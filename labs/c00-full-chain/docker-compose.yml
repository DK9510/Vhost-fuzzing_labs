name: vhc00

services:
  edge:
    image: vhostlab/edge:1.0
    container_name: vhc00-edge
    restart: unless-stopped
    ports:
      - "0.0.0.0:18180:8080"
      - "0.0.0.0:18543:8443"
    volumes:
      - ./edge/sites.json:/etc/vhostlab/sites.json:ro
      - ./edge/certs:/certs:ro
      - ./sites:/sites:ro
    networks:
      lab:

  site-iis:
    image: nginx:alpine
    container_name: vhc00-iis
    restart: unless-stopped
    volumes:
      - ./sites/vhosts:/vhosts:ro
      - ./sites/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      lab:
        ipv4_address: 172.28.110.20

  site-spa:
    image: nginx:alpine
    container_name: vhc00-spa
    restart: unless-stopped
    volumes:
      - ./sites/spa:/spa:ro
      - ./sites/spa/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      lab:
        ipv4_address: 172.28.110.21

  api:
    image: vhostlab/api:1.0
    container_name: vhc00-api
    restart: unless-stopped
    environment:
      DEBUG: "1"
      BROWSABLE: "1"
      FLAG: "${FLAG:-FLAG{full_chain_hidden_vhost_to_admin}}"
      BASE_DOMAIN: "corp.lab"
      API_HOST: "chat-api.corp.lab"
      FRONT_URL: "https://chatadmin.corp.lab"
      ADMIN_EMAIL: "admin@corp.lab"
      ADMIN_PASSWORD: "Sup3rS3cret!2026"
      AGENT_PASSWORD: "agent-pass-2026"
      JWT_KEY: "vhc00-jwt-key-do-not-reuse"
      SECRET_KEY: "vhc00-django-secret"
      DB_PATH: "/data/db.sqlite3"
      EMAIL_HOST: "127.0.0.1"
      EMAIL_PORT: "2525"
      DEFAULT_FROM_EMAIL: "no-reply@corp.lab"
    volumes:
      - api-data:/data
    networks:
      lab:
        ipv4_address: 172.28.110.22

volumes:
  api-data:
    name: vhc00-api-data

networks:
  lab:
    name: vhc00-lab
    ipam:
      config:
        - subnet: 172.28.110.0/24
