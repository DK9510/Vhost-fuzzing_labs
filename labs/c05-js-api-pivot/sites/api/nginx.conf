server {
    listen 80 default_server;
    server_name _;
    root /api;
    server_tokens off;
    autoindex off;
    error_page 404 /404.html;
    location = /404.html { internal; }

    # the API root only: discovery surface, no data yet (that is C07)
    location = /api/ {
        default_type application/json;
        return 200 '{"users":"/api/users/","auth/password_reset":"/api/auth/password_reset","chats":"/api/chats/","chat-status":"/api/chat-status"}';
    }

    # one working endpoint so the base is provably live, not just a string in a bundle
    location = /api/chat-status {
        default_type application/json;
        return 200 '{"service":"chat-api","status":"ok","build":"2026.11.1"}';
    }

    location / { try_files $uri $uri/ =404; }
}
